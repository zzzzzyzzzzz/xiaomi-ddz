<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="第一人称 3D 斗地主：你和两只低多边形小猫煤球、小咪打牌。">
<title>小咪打牌中</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=VT323&family=Pixelify+Sans:wght@500;700&family=Silkscreen:wght@400&family=ZCOOL+KuaiLe&display=swap">
<style>
/* Layout: one full-bleed 3D room seen from your chair; HUD floats at the edges, your hand of cards along the bottom. */
:root{
  color-scheme: dark;
  --night:#170f1e;      /* room shadow */
  --plum:#2b1933;       /* panels */
  --plum-hi:#3d2647;
  --paper:#f5ecd8;      /* card stock */
  --ink:#24161f;        /* black suits, text on paper */
  --suit-red:#c9334b;   /* hearts / diamonds */
  --neon:#ff88c9;       /* sign + accent */
  --gold:#f6c453;       /* landlord */
  --text:#f8eff9;
  --muted:#bba9c8;
  --felt:#2e6b59;
  --font-pixel:"Silkscreen", ui-monospace, "Courier New", monospace;
  --font-rank:"VT323", ui-monospace, "Courier New", monospace;
  --font-cn:"ZCOOL KuaiLe", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  --cw: clamp(38px, 4.9vw, 64px);
  --ch: calc(var(--cw) * 1.42);
}
html,body{height:100%}
body{background:var(--night);color:var(--text);font-family:var(--font-cn);overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#scene{position:fixed;inset:0;width:100%;height:100%;display:block;image-rendering:pixelated;image-rendering:crisp-edges}
#ui{position:fixed;inset:0;pointer-events:none;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:max(10px, env(safe-area-inset-top, 0px)) max(10px, env(safe-area-inset-bottom, 0px));display:flex;flex-direction:column;justify-content:space-between}
#ui button, #start, #result{pointer-events:auto}
#handCanvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.hudBtns{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.hudBtns .btn{font-size:14px;padding:4px 10px}
.hudBtns .btn[aria-pressed="false"]{opacity:.6}

/* pixel border: four offset shadows draw a 2px outline with notched corners */
:root{
  --px-border: 0 -2px 0 0 var(--ink), 0 2px 0 0 var(--ink), -2px 0 0 0 var(--ink), 2px 0 0 0 var(--ink);
  --px-border-hi: 0 -2px 0 0 var(--plum-hi), 0 2px 0 0 var(--plum-hi), -2px 0 0 0 var(--plum-hi), 2px 0 0 0 var(--plum-hi);
  --lilac:#c3b0ff;
  --dither: radial-gradient(rgba(255,255,255,.045) 1px, transparent 1.2px) 0 0/4px 4px;
}
/* top bar */
#hud{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-start;justify-content:space-between}
.panel{background:var(--dither), color-mix(in srgb, var(--plum) 90%, transparent);padding:6px 10px;margin:2px;
  box-shadow:var(--px-border), inset 0 2px 0 0 rgba(255,255,255,.08), 0 6px 0 0 rgba(23,15,30,.45)}
.panel .cap{grid-column:1/-1;font-family:var(--font-pixel);font-size:10px;letter-spacing:.12em;color:var(--lilac);opacity:.85;margin-bottom:2px}
#scores{display:grid;grid-template-columns:auto auto;column-gap:14px;row-gap:1px;font-size:14px;align-items:baseline}
#scores .v{font-family:var(--font-rank);font-size:20px;line-height:1;text-align:right;font-variant-numeric:tabular-nums}
#round{display:flex;gap:14px;align-items:center;font-size:14px}
#round .num{font-family:var(--font-rank);color:var(--gold);font-size:22px;line-height:1}
#bottomCards{display:flex;gap:4px;align-items:center}
#bottomCards .lbl{font-size:13px;color:var(--muted);margin-right:4px}

/* cards */
.card{position:relative;width:var(--cw);height:calc(var(--cw) * 1.42);background:var(--paper);color:var(--ink);border:2px solid var(--ink);box-shadow:inset -2px -2px 0 #d8cbb0, 2px 2px 0 rgba(0,0,0,.35);flex:none;font-family:var(--font-pixel);transition:transform .12s steps(3)}
.card.red{color:var(--suit-red)}
.card .r{position:absolute;left:3px;top:0;font-family:var(--font-rank);font-size:calc(var(--cw)*0.46);line-height:1;font-weight:400;letter-spacing:-1px}
.card .s{position:absolute;left:4px;top:calc(var(--cw)*0.37);font-size:calc(var(--cw)*0.26);line-height:1;font-family:system-ui,sans-serif}
.card .big{position:absolute;right:4px;bottom:2px;font-size:calc(var(--cw)*0.52);line-height:1;font-family:system-ui,sans-serif}
.card.joker .r{writing-mode:vertical-rl;font-family:var(--font-pixel);font-size:calc(var(--cw)*0.2);letter-spacing:0;left:3px;top:3px}
.card.joker .big{font-family:var(--font-cn);font-size:calc(var(--cw)*0.36)}
.card.mini{--cw:30px;margin-left:-14px}
.card.mini:first-child{margin-left:0}
.card.tiny{--cw:24px}

/* table anchors */
.anchor{position:fixed;left:0;top:0;transform:translate(-50%,-50%);pointer-events:none;will-change:transform}
.played{display:flex;align-items:center;justify-content:center}
.played > *{animation:dealIn .22s steps(3) both}
.played .pass{font-size:17px;color:var(--text);background:rgba(23,15,30,.78);padding:2px 12px;box-shadow:var(--px-border-hi)}
.played .type{position:absolute;top:-22px;left:50%;transform:translateX(-50%);white-space:nowrap;font-size:13px;color:var(--ink);background:var(--gold);padding:0 6px;box-shadow:var(--px-border);animation:none}
@keyframes dealIn{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}
.tag{display:flex;flex-direction:column;align-items:center;gap:3px;text-shadow:2px 2px 0 var(--night)}
.tag .name{font-size:17px}
.tag .meta{display:flex;gap:6px;align-items:center;font-size:13px}
.tag .count{font-family:var(--font-rank);font-size:18px;line-height:1;background:var(--plum);padding:1px 6px 0;box-shadow:var(--px-border-hi);font-variant-numeric:tabular-nums;text-shadow:none}
.tag .count.low{background:var(--suit-red);box-shadow:0 -2px 0 0 #ff9aa9,0 2px 0 0 #ff9aa9,-2px 0 0 0 #ff9aa9,2px 0 0 0 #ff9aa9;animation:blink 1s steps(2) infinite}
.role{font-size:12px;padding:0 5px;text-shadow:none;background:rgba(23,15,30,.7);box-shadow:0 -2px 0 0 currentColor,0 2px 0 0 currentColor,-2px 0 0 0 currentColor,2px 0 0 0 currentColor;margin:2px}
.role.lord{color:var(--gold)}
.role.lord::before{content:"♛ ";font-family:system-ui,sans-serif}
.role.farm{color:#9fe0c3}
.tag.active .name{color:var(--neon)}
.tag.active .name::after{content:" ◀";font-family:var(--font-pixel);font-size:12px;display:inline-block;animation:blink .8s steps(2) infinite}
@keyframes blink{50%{opacity:.35}}
.bubble{background:var(--paper);color:var(--ink);font-size:16px;padding:4px 12px;white-space:nowrap;position:relative;transition:opacity .2s, transform .2s steps(3);
  box-shadow:var(--px-border), 0 5px 0 0 rgba(23,15,30,.45)}
.bubble::before,.bubble::after{content:"";position:absolute;left:50%;background:var(--ink)}
.bubble::before{width:10px;height:4px;bottom:-6px;margin-left:-5px;background:var(--paper);box-shadow:-2px 0 0 0 var(--ink),2px 0 0 0 var(--ink)}
.bubble::after{width:4px;height:4px;bottom:-10px;margin-left:-2px;box-shadow:-2px -2px 0 0 var(--ink),2px -2px 0 0 var(--ink)}
.bubble[data-off="1"]{opacity:0;transform:translateY(4px)}

/* bottom: me */
#me{display:flex;flex-direction:column;align-items:center;gap:8px}
#controls{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;min-height:40px;align-items:center}
#myline{display:flex;gap:8px;align-items:center;font-size:14px;text-shadow:2px 2px 0 var(--night)}
.btn{font-family:var(--font-cn);font-size:16px;color:var(--ink);background:var(--paper);border:0;padding:5px 15px;margin:2px;cursor:pointer;position:relative;
  box-shadow:var(--px-border), inset 0 2px 0 0 rgba(255,255,255,.55), inset 0 -3px 0 0 rgba(36,22,31,.16), 0 5px 0 0 rgba(23,15,30,.55);
  transition:transform .08s steps(2), filter .1s}
.btn.primary{background:var(--neon)}
.btn.gold{background:var(--gold)}
.btn:hover:not(:disabled){transform:translateY(-1px);filter:brightness(1.07)}
.btn:active:not(:disabled){transform:translateY(3px);box-shadow:var(--px-border), inset 0 2px 0 0 rgba(36,22,31,.18), 0 2px 0 0 rgba(23,15,30,.55)}
.btn:disabled{opacity:.42;cursor:default}
.btn:focus-visible{outline:3px solid var(--gold);outline-offset:4px}
#hand{width:100%;height:30vh;pointer-events:none;flex:none}
#hand .card{cursor:pointer}
#hand .card.sel{transform:translateY(-16px)}
#hand .card.hint{outline:2px dashed var(--neon);outline-offset:-5px}

#toast{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%);font-size:clamp(22px,4vw,34px);color:var(--gold);z-index:60;
  text-shadow:2px 0 0 var(--night),-2px 0 0 var(--night),0 2px 0 var(--night),0 -2px 0 var(--night),3px 4px 0 rgba(23,15,30,.6);pointer-events:none;white-space:nowrap;transition:opacity .25s}
#toast[data-off="0"]{animation:toastIn .32s steps(4) both}
#toast[data-off="1"]{opacity:0}
@keyframes toastIn{0%{transform:translate(-50%,-50%) scale(.6)}60%{transform:translate(-50%,-50%) scale(1.12)}100%{transform:translate(-50%,-50%) scale(1)}}

/* overlays: little Y2K-era windows */
#ui{z-index:50}
.overlay{position:fixed;inset:0;display:grid;place-items:center;z-index:40;background:radial-gradient(ellipse at center, rgba(23,15,30,.2), rgba(23,15,30,.62));padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.sheet{background:var(--dither), var(--plum);max-width:430px;width:100%;display:flex;flex-direction:column;align-items:stretch;text-align:center;margin:4px;
  box-shadow:0 -3px 0 0 var(--ink),0 3px 0 0 var(--ink),-3px 0 0 0 var(--ink),3px 0 0 0 var(--ink), 0 10px 0 0 rgba(23,15,30,.5);
  animation:winIn .28s steps(4) both}
@keyframes winIn{from{transform:translateY(14px) scale(.96);opacity:0}to{transform:none;opacity:1}}
.titlebar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:4px 8px 4px 10px;background:linear-gradient(90deg,#ff8fcf,#c3a6ff 60%,#9fb8ff);color:var(--ink);font-family:var(--font-pixel);font-size:11px;letter-spacing:.06em}
.titlebar .dots{display:flex;gap:4px}
.titlebar .dots i{width:9px;height:9px;background:var(--paper);box-shadow:var(--px-border)}
.sheet .body{display:flex;flex-direction:column;gap:12px;align-items:center;padding:18px 22px 22px}
.sheet h1{font-size:clamp(30px,7vw,44px);font-weight:400;margin:0;color:var(--neon);text-shadow:3px 3px 0 var(--night);text-wrap:balance}
.sheet h2{font-size:30px;font-weight:400;margin:0;text-wrap:balance;text-shadow:3px 3px 0 var(--night)}
.sheet p{margin:0;color:var(--muted);line-height:1.65;font-size:15px;max-width:34ch}
.sheet .sub{font-family:var(--font-pixel);font-size:11px;letter-spacing:.1em;color:var(--gold)}
.sheet .btn{margin-top:6px;font-size:18px;padding:7px 26px}
#resultRows{display:grid;grid-template-columns:1fr auto auto;gap:6px 18px;font-size:16px;width:100%;max-width:300px;align-items:baseline;padding:10px 12px;background:rgba(23,15,30,.4);box-shadow:var(--px-border-hi)}
#resultRows .d{font-family:var(--font-rank);font-size:22px;line-height:1;text-align:right;font-variant-numeric:tabular-nums}
#resultRows .up{color:#9fe0c3}
#resultRows .down{color:#ff9aa9}
#tag1,#tag2,#bub1,#bub2{z-index:36}
.tag{pointer-events:auto;cursor:pointer;padding:6px 12px}
.tag:hover .name,.tag:focus-visible .name{color:var(--gold)}
.tag:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.sheet{max-height:calc(100% - 24px);overflow:auto}
.lobbyMenu{display:flex;flex-direction:column;gap:12px;align-items:center;width:100%}
.field{display:flex;flex-direction:column;gap:6px;width:100%;align-items:center}
.field label,.flabel{font-size:13px;color:var(--lilac)}
.sheet input{font-family:var(--font-cn);font-size:16px;color:var(--ink);background:var(--paper);border:0;padding:6px 10px;margin:2px;box-shadow:var(--px-border);width:min(220px,100%);text-align:center}
.sheet input:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.skins{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;width:100%;max-width:360px}
.skin small{font-size:10px;color:var(--lilac);line-height:1}
.skin.on small{color:var(--gold)}
.skin{font-family:var(--font-cn);font-size:13px;color:var(--text);background:rgba(23,15,30,.45);border:0;padding:7px 4px 5px;margin:2px;display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer;box-shadow:var(--px-border-hi)}
.skin.on{color:var(--gold);box-shadow:0 -2px 0 0 var(--gold),0 2px 0 0 var(--gold),-2px 0 0 0 var(--gold),2px 0 0 0 var(--gold)}
.skin:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.chip{display:inline-block;width:28px;height:18px;flex:none;background:linear-gradient(135deg,var(--a) 0 55%,var(--b) 55%);box-shadow:var(--px-border)}
.row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;align-items:center}
.row.join input{width:118px;text-transform:uppercase;letter-spacing:.2em;font-family:var(--font-rank);font-size:24px;padding:2px 8px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.note{font-size:13px;color:var(--gold);max-width:34ch}
#roomBox{display:flex;flex-direction:column;gap:10px;align-items:center;width:100%}
.code{font-size:14px;color:var(--muted)}
.code b{font-family:var(--font-rank);font-weight:400;font-size:36px;letter-spacing:.15em;color:var(--neon);vertical-align:middle}
#inviteText{width:100%;font-size:12px;text-align:left}
#seatList{list-style:none;margin:2px;padding:8px 10px;width:100%;max-width:300px;display:flex;flex-direction:column;gap:7px;background:rgba(23,15,30,.4);box-shadow:var(--px-border-hi)}
#seatList li{display:flex;align-items:center;gap:8px;font-size:15px}
#seatList b{font-weight:400}
#seatList em{margin-left:auto;font-style:normal;font-size:12px;color:var(--muted)}
#giftMenu{position:fixed;z-index:70;display:flex;flex-direction:column;gap:8px;padding:10px;background:var(--dither), var(--plum);
  box-shadow:0 -3px 0 0 var(--ink),0 3px 0 0 var(--ink),-3px 0 0 0 var(--ink),3px 0 0 0 var(--ink),0 8px 0 0 rgba(23,15,30,.5);animation:winIn .2s steps(3) both}
#giftMenu .gm-title{font-size:13px;color:var(--lilac);text-align:center}
#giftMenu .btn{font-size:15px;padding:4px 14px}
.btn.warn{background:#ff9a8a}
#splash{position:fixed;inset:0;z-index:58;pointer-events:none;opacity:0}
#splash.on{animation:splashGlow 1.5s steps(6) both}
#splash.flower{background:radial-gradient(ellipse at center, transparent 55%, rgba(255,143,198,.45))}
#splash.heart{background:radial-gradient(ellipse at center, transparent 50%, rgba(255,111,174,.5))}
#splash.fish{background:radial-gradient(ellipse at center, transparent 55%, rgba(159,178,200,.45))}
#splash.yarn{background:radial-gradient(ellipse at center, transparent 55%, rgba(243,155,201,.45))}
#splash.tomato{animation:splat 2.2s steps(8) both;background:
  radial-gradient(circle at 47% 42%, #e0393e 0 8%, transparent 8.4%),
  radial-gradient(circle at 55% 48%, #c42a30 0 6%, transparent 6.4%),
  radial-gradient(circle at 41% 50%, #e0393e 0 4.5%, transparent 4.9%),
  radial-gradient(circle at 60% 37%, #ff6a5e 0 2.4%, transparent 2.8%),
  radial-gradient(circle at 36% 36%, #e0393e 0 2%, transparent 2.4%),
  linear-gradient(#e0393e,#e0393e) 49% 50%/1.2% 22% no-repeat,
  linear-gradient(#c42a30,#c42a30) 54% 52%/1% 16% no-repeat}
@keyframes splashGlow{0%{opacity:0}15%{opacity:1}70%{opacity:1}100%{opacity:0}}
@keyframes splat{0%{opacity:0;transform:scale(.5)}8%{opacity:1;transform:scale(1.05)}14%{transform:scale(1)}75%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(28px)}}
#loading{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:var(--night);font-family:var(--font-pixel);color:var(--neon);font-size:14px;letter-spacing:.1em}
@media (max-width:560px){
  #scores{font-size:12px}
  #round{font-size:12px;gap:8px}
  .tag .name{font-size:14px}
  .btn{font-size:15px;padding:5px 10px}
  .card.mini{--cw:24px;margin-left:-11px}
}
@media (prefers-reduced-motion: reduce){ .card,.bubble,#toast,.btn{transition:none} #splash.on,#giftMenu,.played > *,#toast[data-off="0"],.sheet,.tag .count.low,.tag.active .name::after{animation:none} }
</style>
<style>html,body{margin:0}[hidden]{display:none!important}</style>
</head>
<body>


<canvas id="scene" aria-label="牌桌：两只小猫坐在你对面"></canvas>
<div id="anchors">
  <div class="anchor" id="tag1"><div class="tag"><span class="name">煤球</span><span class="meta"><span class="role" hidden></span><span class="count">17</span></span></div></div>
  <div class="anchor" id="tag2"><div class="tag"><span class="name">小咪</span><span class="meta"><span class="role" hidden></span><span class="count">17</span></span></div></div>
  <div class="anchor" id="bub1"><div class="bubble" data-off="1"></div></div>
  <div class="anchor" id="bub2"><div class="bubble" data-off="1"></div></div>
  <div class="anchor played" id="played0"></div>
  <div class="anchor played" id="played1"></div>
  <div class="anchor played" id="played2"></div>
</div>
<canvas id="handCanvas" aria-label="我的手牌：两只猫爪拿着的扇形牌"></canvas>
<div id="ui">
  <div id="hud">
    <div class="panel" id="scores" aria-label="积分">
      <span class="cap">SCORE</span>
      <span id="scn0">我</span><span class="v" id="sc0">0</span>
      <span id="scn1">煤球</span><span class="v" id="sc1">0</span>
      <span id="scn2">小咪</span><span class="v" id="sc2">0</span>
    </div>
    <div class="panel" id="round">
      <span>底分 <span class="num" id="baseNum">–</span></span>
      <span>倍数 <span class="num" id="multNum">×1</span></span>
      <div id="bottomCards"><span class="lbl">底牌</span></div>
    </div>
    <div class="hudBtns"><button class="btn" id="musicBtn" type="button" aria-pressed="true">♪ 音乐 开</button><button class="btn" id="sfxBtn" type="button" aria-pressed="true">音效 开</button><button class="btn" id="sceneBtn" type="button">去海边</button></div>
  </div>
  <div id="me">
    <div id="controls"></div>
    <div id="myline"><span class="role" id="myRole" hidden></span><span id="myHint"></span></div>
    <div id="hand" aria-hidden="true"></div>
  </div>
</div>
<div id="toast" data-off="1"></div>
<div id="giftMenu" role="menu" hidden></div>
<div id="splash" aria-hidden="true"></div>
<div class="overlay" id="start" hidden>
  <div class="sheet" role="dialog" aria-labelledby="startTitle">
    <div class="titlebar"><span>XIAOMI_DDZ.EXE</span><span class="dots" aria-hidden="true"><i></i><i></i><i></i></span></div>
    <div class="body">
    <span class="sub">3 PLAYERS · 54 CARDS</span>
    <h1 id="startTitle">小咪打牌中</h1>
    <p>三个人斗地主，叫分最高的当地主。点对面小猫的名字，可以送花或者扔东西。</p>
    <div class="field"><label for="nameInput">昵称</label><input id="nameInput" maxlength="8" autocomplete="off" placeholder="我"></div>
    <div class="field"><span class="flabel" id="skinLabel">选你的小猫</span><div id="skinPicker" class="skins" role="radiogroup" aria-labelledby="skinLabel"></div></div>
    <div id="lobbyMenu" class="lobbyMenu">
      <div class="row"><button class="btn primary" id="startBtn">和小猫打</button></div>
      <div id="onlineRow" class="lobbyMenu">
        <div class="row"><button class="btn" id="hostBtn">创建房间</button></div>
        <div class="row join"><label class="sr" for="codeInput">房间码</label><input id="codeInput" maxlength="5" autocomplete="off" placeholder="房间码"><button class="btn" id="joinBtn">加入</button></div>
      </div>
    </div>
    <div id="roomBox" hidden>
      <div class="code">房间码 <b id="roomCode"></b></div>
      <button class="btn" id="copyBtn">复制邀请链接</button>
      <input id="inviteText" readonly hidden aria-label="邀请链接">
      <ol id="seatList" aria-label="座位"></ol>
      <button class="btn primary" id="roomStartBtn">开始</button>
      <p class="note" id="roomWait">等房主开局…</p>
    </div>
    <p class="note" id="lobbyMsg" hidden></p>
    </div>

// ===== Dou Dizhu rules + cat AI =====
// rank: 3..14 (A), 15 = 2, 16 = small joker, 17 = big joker
const RANK_LABEL = {11:'J',12:'Q',13:'K',14:'A',15:'2',16:'小王',17:'大王'};
const rankLabel = r => RANK_LABEL[r] || String(r);
const SUITS = ['S','H','C','D'];
const SUIT_CHAR = {S:'♠',H:'♥',C:'♣',D:'♦',J:''};

function makeDeck(){
  const d=[]; let id=0;
  for(let r=3;r<=15;r++) for(const s of SUITS) d.push({id:id++, rank:r, suit:s});
  d.push({id:id++, rank:16, suit:'J'}); d.push({id:id++, rank:17, suit:'J'});
  return d;
}
function shuffle(a, rnd=Math.random){
  for(let i=a.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1)); [a[i],a[j]]=[a[j],a[i]];}
  return a;
}
const sortHand = h => h.sort((a,b)=> b.rank-a.rank || SUITS.indexOf(a.suit)-SUITS.indexOf(b.suit));
function countRanks(cards){ const m=new Map(); for(const c of cards) m.set(c.rank,(m.get(c.rank)||0)+1); return m; }

function isRun(ranks){ // sorted asc distinct, all <=14
  if(ranks[ranks.length-1]>14) return false;
  for(let i=1;i<ranks.length;i++) if(ranks[i]!==ranks[i-1]+1) return false;
  return true;
}
// find highest run of k consecutive ranks (<=14) with count>=3
function tripleRun(cnt, k){
  const tri=[...cnt.keys()].filter(r=>cnt.get(r)>=3 && r<=14).sort((a,b)=>a-b);
  let best=null;
  for(let i=0;i+k<=tri.length;i++){ const run=tri.slice(i,i+k); if(isRun(run)) best=run; }
  return best;
}

// Returns {type, main, n} or null
function analyze(cards){
  const n=cards.length; if(!n) return null;
  const cnt=countRanks(cards);
  const ranks=[...cnt.keys()].sort((a,b)=>a-b);
  const vals=ranks.map(r=>cnt.get(r));
  const only=(c)=>vals.every(v=>v===c);
  if(n===2 && cnt.has(16) && cnt.has(17)) return {type:'rocket',main:17,n};
  if(n===1) return {type:'single',main:ranks[0],n};
  if(ranks.length===1){
    if(n===2) return {type:'pair',main:ranks[0],n};
    if(n===3) return {type:'triple',main:ranks[0],n};
    if(n===4) return {type:'bomb',main:ranks[0],n};
  }
  if(n===4 && ranks.length===2 && vals.includes(3)) return {type:'triple1',main:ranks[vals.indexOf(3)],n};
  if(n===5 && ranks.length===2 && vals.includes(3) && vals.includes(2)) return {type:'triple2',main:ranks[vals.indexOf(3)],n};
  if(n>=5 && only(1) && isRun(ranks)) return {type:'straight',main:ranks[ranks.length-1],n};
  if(n>=6 && n%2===0 && only(2) && ranks.length>=3 && isRun(ranks)) return {type:'pairs',main:ranks[ranks.length-1],n};
  if(n>=6 && n%3===0 && only(3) && ranks.length>=2 && isRun(ranks)) return {type:'plane',main:ranks[ranks.length-1],n};
  const four=ranks.find(r=>cnt.get(r)===4);
  if(four!==undefined && n===6) return {type:'four2',main:four,n};
  if(four!==undefined && n===8){
    const rest=ranks.filter(r=>r!==four);
    if(rest.every(r=>cnt.get(r)===2||cnt.get(r)===4)) return {type:'four22',main:four,n};
  }
  if(n>=8 && n%4===0){ const k=n/4, run=tripleRun(cnt,k); if(run) return {type:'plane1',main:run[run.length-1],n}; }
  if(n>=10 && n%5===0){
    const k=n/5, run=tripleRun(cnt,k);
    if(run){
      const rest=new Map(cnt); for(const r of run) rest.set(r,rest.get(r)-3);
      let pairs=0, ok=true;
      for(const [r,v] of rest){ if(v%2) {ok=false;break;} if(v && r>=16){ok=false;break;} pairs+=v/2; }
      if(ok && pairs===k) return {type:'plane2',main:run[run.length-1],n};
    }
  }
  return null;
}
function canBeat(a, b){
  if(!a) return false;
  if(!b) return true;
  if(a.type==='rocket') return true;
  if(b.type==='rocket') return false;
  if(a.type==='bomb' && b.type!=='bomb') return true;
  if(a.type!==b.type || a.n!==b.n) return false;
  return a.main>b.main;
}
const TYPE_NAME = {single:'单张',pair:'对子',triple:'三张',triple1:'三带一',triple2:'三带二',straight:'顺子',pairs:'连对',
  plane:'飞机',plane1:'飞机带翅膀',plane2:'飞机带翅膀',four2:'四带二',four22:'四带两对',bomb:'炸弹',rocket:'王炸'};

// ---------- move generation for AI / hints ----------
function generateMoves(hand){
  const cnt=countRanks(hand);
  const byRank=new Map(); for(const c of hand){ if(!byRank.has(c.rank)) byRank.set(c.rank,[]); byRank.get(c.rank).push(c); }
  const take=(r,k)=>byRank.get(r).slice(0,k);
  const ranks=[...cnt.keys()].sort((a,b)=>a-b);
  const moves=[];
  const push=(cards)=>{ const info=analyze(cards); if(info) moves.push({cards,info}); };
  // kicker pickers (exclude main ranks), prefer lone cards, low ranks
  const kickers=(exclude, k, size)=>{
    const pool=ranks.filter(r=>!exclude.includes(r) && cnt.get(r)>=size && !(size===2 && r>=16));
    pool.sort((a,b)=>{
      const fa=(cnt.get(a)===size?0:1)+(a>=15?2:0), fb=(cnt.get(b)===size?0:1)+(b>=15?2:0);
      return fa-fb || a-b;
    });
    if(pool.length<k) return null;
    const out=[]; for(const r of pool.slice(0,k)) out.push(...take(r,size));
    return out;
  };
  for(const r of ranks){
    const c=cnt.get(r);
    push(take(r,1));
    if(c>=2) push(take(r,2));
    if(c>=3){
      push(take(r,3));
      const k1=kickers([r],1,1); if(k1) push([...take(r,3),...k1]);
      const k2=kickers([r],1,2); if(k2) push([...take(r,3),...k2]);
    }
    if(c===4) push(take(r,4));
  }
  // straights
  for(let s=3;s<=10;s++) for(let e=s;e<=14;e++){ if(!cnt.get(e)) break; if(e-s+1>=5){ const cs=[]; for(let r=s;r<=e;r++) cs.push(...take(r,1)); push(cs);} }
  // pair runs
  for(let s=3;s<=12;s++) for(let e=s;e<=14;e++){ if((cnt.get(e)||0)<2) break; if(e-s+1>=3){ const cs=[]; for(let r=s;r<=e;r++) cs.push(...take(r,2)); push(cs);} }
  // planes
  for(let s=3;s<=13;s++) for(let e=s+1;e<=14;e++){
    if((cnt.get(s)||0)<3) break;
    if((cnt.get(e)||0)<3) break;
    const main=[]; const used=[]; for(let r=s;r<=e;r++){ main.push(...take(r,3)); used.push(r); }
    const k=used.length;
    push(main);
    const w1=kickers(used,k,1); if(w1) push([...main,...w1]);
    const w2=kickers(used,k,2); if(w2) push([...main,...w2]);
  }
  if(cnt.has(16)&&cnt.has(17)) push([...take(16,1),...take(17,1)]);
  return moves;
}

// cost of a move given hand (lower = better to play)
function moveCost(move, hand){
  const cnt=countRanks(hand), used=countRanks(move.cards);
  let cost=move.info.main - move.cards.length*1.15;
  for(const [r,u] of used){
    const have=cnt.get(r);
    if(u<have) cost += have===4 ? 18 : 4;          // breaking a set
    if(r>=15 && hand.length>6) cost += 5;            // save 2s and jokers
  }
  if(move.info.type==='bomb'||move.info.type==='rocket') cost+=40;
  return cost;
}

// AI decision. ctx: {hand, seat, landlord, last:{seat,info,cards}|null, counts:[n,n,n]}
function aiChoose(ctx){
  const {hand, seat, landlord, last, counts}=ctx;
  const all=generateMoves(hand);
  const finish=all.find(m=>m.cards.length===hand.length && (!last || canBeat(m.info,last.info)));
  if(finish) return finish;
  const isTeam=(a,b)=> a===b || (a!==landlord && b!==landlord);
  const opps=[0,1,2].filter(s=>!isTeam(s,seat));
  const minOpp=Math.min(...opps.map(s=>counts[s]));
  const nextSeat=(seat+1)%3, nextIsOpp=!isTeam(nextSeat,seat);
  const danger=(m)=>{ // stop an opponent who is about to go out
    if(minOpp===1 && m.info.type==='single') return 25 - (m.info.main/2);
    if(minOpp===2 && m.info.type==='pair') return 15;
    return 0;
  };
  if(!last){
    let cands=all.filter(m=>m.info.type!=='bomb'&&m.info.type!=='rocket');
    if(!cands.length) cands=all;
    let best=null, bc=Infinity;
    for(const m of cands){
      let c=moveCost(m,hand)+danger(m);
      if(minOpp===1 && m.info.type==='single'){ // only play your top single then
        const top=Math.max(...hand.map(x=>x.rank));
        c = m.info.main===top ? c-20 : c;
      }
      if(c<bc){bc=c;best=m;}
    }
    return best;
  }
  const beaters=all.filter(m=>canBeat(m.info,last.info));
  if(!beaters.length) return null;
  const teammateLast = isTeam(last.seat,seat);
  if(teammateLast){
    // let teammate's play ride unless it is tiny and we can cover cheaply without breaking anything
    if(!nextIsOpp || counts[last.seat]<=3) return null;
    const cheap=beaters.filter(m=>m.info.type!=='bomb'&&m.info.type!=='rocket' && m.info.main<=11 && moveCost(m,hand)<=m.info.main-m.cards.length*1.15+0.01);
    if(last.info.main<=8 && cheap.length && Math.random()<0.5) return cheap.sort((a,b)=>a.info.main-b.info.main)[0];
    return null;
  }
  const normal=beaters.filter(m=>m.info.type!=='bomb'&&m.info.type!=='rocket');
  if(normal.length){
    let best=null, bc=Infinity;
    for(const m of normal){ const c=moveCost(m,hand); if(c<bc){bc=c;best=m;} }
    // don't burn a 2 / joker on a small single early unless pressured
    const pressured = counts[last.seat]<=5 || hand.length<=5;
    if(!pressured && best.info.main>=15 && last.info.main<=10 && hand.length>8 && Math.random()<0.6) return null;
    return best;
  }
  const big=beaters.sort((a,b)=>a.info.main-b.info.main + (a.info.type==='rocket'?100:0)-(b.info.type==='rocket'?100:0));
  const pressured = counts[last.seat]<=6 || hand.length - big[0].cards.length <= 5;
  return (pressured || Math.random()<0.25) ? big[0] : null;
}

function aiBid(hand, current){
  const cnt=countRanks(hand); let s=0;
  if(cnt.has(17)) s+=4; if(cnt.has(16)) s+=3;
  s+=(cnt.get(15)||0)*2; s+=(cnt.get(14)||0)*1;
  for(const [r,v] of cnt) if(v===4) s+=4;
  const want = s>=10?3 : s>=7?2 : s>=5?1 : 0;
  return want>current ? want : 0;
}

// hint list for the human: all beating moves sorted cheapest first
function hints(hand, last){
  const all=generateMoves(hand).filter(m=>!last||canBeat(m.info,last.info));
  return all.sort((a,b)=>moveCost(a,hand)-moveCost(b,hand));
}

const AUDIO={ctx:null, music:true, sfx:true};

}

  const cg=ctx.createGain(); cg.gain.value=0.35; cr.connect(hp); hp.connect(cg); cg.connect(musicBus); cr.start();

function scheduleLofi(){

// ---- 8-bit sound effects ----
function blip(freq,t,dur,type='square',vol=0.1,slideTo){
  const ctx=AUDIO.ctx, o=ctx.createOscillator(), g=ctx.createGain();
  o.type=type; o.frequency.setValueAtTime(freq,t); if(slideTo) o.frequency.exponentialRampToValueAtTime(slideTo,t+dur);
  g.gain.setValueAtTime(vol,t); g.gain.setValueAtTime(vol,t+dur*0.7); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g); g.connect(sfxBus); o.start(t); o.stop(t+dur+0.02);
}
let lastTick=0;
function sfx(kind,arg){
  if(!AUDIO.sfx) return; const ctx=ensureAudio(); if(!ctx) return;
  const t=ctx.currentTime+0.005, N=mtof;
  switch(kind){
    case 'tick': if(t-lastTick<0.04) return; lastTick=t; blip(N(96),t,0.022,'square',0.03); break;
    case 'select': if(arg){ blip(N(84),t,0.05,'square',0.08); blip(N(91),t+0.045,0.06,'square',0.07); } else blip(N(79),t,0.07,'square',0.06,N(72)); break;
    case 'ui': blip(N(88),t,0.035,'square',0.06); break;
    case 'deal': for(let i=0;i<14;i++) blip(N(88+(i%3)*3),t+i*0.045,0.025,'square',0.045); break;
    case 'play': {
      const cat=arg&&arg.seat>0, base=cat?67:72;
      [0,4,7,12].forEach((d,i)=>blip(N(base+d),t+i*0.05,0.07,cat?'triangle':'square',cat?0.11:0.08));
      if(cat) blip(N(76),t+0.22,0.24,'triangle',0.07,N(84));   // little "meow" glide
      break; }
    case 'pass': blip(N(72),t,0.08,'square',0.06); blip(N(67),t+0.09,0.12,'square',0.05); break;
    case 'bomb': {
      const s=ctx.createBufferSource(); s.buffer=getNoise(); const f=ctx.createBiquadFilter(); f.type='lowpass';
      f.frequency.setValueAtTime(3000,t); f.frequency.exponentialRampToValueAtTime(120,t+0.6);
      const g=ctx.createGain(); g.gain.setValueAtTime(0.32,t); g.gain.exponentialRampToValueAtTime(0.0001,t+0.7);
      s.connect(f); f.connect(g); g.connect(sfxBus); s.start(t); s.stop(t+0.75);
      blip(440,t,0.5,'square',0.1,50); break; }
    case 'throw': { const n=ctx.createBufferSource(); n.buffer=getNoise(); const f=ctx.createBiquadFilter(); f.type='bandpass'; f.Q.value=1.2;
      f.frequency.setValueAtTime(500,t); f.frequency.exponentialRampToValueAtTime(2600,t+0.3); const g=ctx.createGain(); g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.12,t+0.08); g.gain.exponentialRampToValueAtTime(0.0001,t+0.35);
      n.connect(f); f.connect(g); g.connect(sfxBus); n.start(t); n.stop(t+0.4); break; }
    case 'hit_flower': [84,88,91,96].forEach((m,i)=>blip(N(m),t+i*0.06,0.12,'triangle',0.08)); break;
    case 'hit_heart': [79,84,88,91].forEach((m,i)=>blip(N(m),t+i*0.05,0.1,'square',0.06)); break;
    case 'hit_fish': blip(N(60),t,0.12,'square',0.08,N(72)); blip(N(76),t+0.12,0.08,'square',0.06); break;
    case 'hit_yarn': blip(N(55),t,0.18,'triangle',0.1,N(67)); blip(N(62),t+0.16,0.16,'triangle',0.08,N(74)); break;
    case 'hit_tomato': { const n=ctx.createBufferSource(); n.buffer=getNoise(); const f=ctx.createBiquadFilter(); f.type='lowpass'; f.frequency.setValueAtTime(1800,t); f.frequency.exponentialRampToValueAtTime(200,t+0.25);
      const g=ctx.createGain(); g.gain.setValueAtTime(0.25,t); g.gain.exponentialRampToValueAtTime(0.0001,t+0.3); n.connect(f); f.connect(g); g.connect(sfxBus); n.start(t); n.stop(t+0.32);
      blip(200,t,0.2,'square',0.07,70); break; }
    case 'landlord': [72,76,79,84].forEach((m,i)=>blip(N(m),t+i*0.09,0.1,'square',0.08)); break;
    case 'win': [72,76,79,84,79,84,88].forEach((m,i)=>blip(N(m),t+i*0.1,0.12,'square',0.08)); break;
    case 'lose': [76,72,68,64].forEach((m,i)=>blip(N(m),t+i*0.16,0.2,'triangle',0.1)); break;
  }
}

let ORIG_FUR=null, VC_FUR=null;
const skinGeoCache=new Map(), accMatCache=new Map();
function skinGeo(i, mesh){
  const src=mesh.userData.geo0, key=i+'|'+src.uuid;
  if(skinGeoCache.has(key)) return skinGeoCache.get(key);
  const g=src.index? src.toNonIndexed() : src.clone();
  const P=g.attributes.position, SI=g.attributes.skinIndex, SW=g.attributes.skinWeight, bones=mesh.skeleton.bones;
  const col=new Float32Array(P.count*3), c=new THREE.Color();
  const dom=v=>{ let bi=0,bw=-1; for(let k=0;k<4;k++){ const w=SW.getComponent(v,k); if(w>bw){ bw=w; bi=SI.getComponent(v,k); } } return [bones[bi]?bones[bi].name:'', bw]; };
  for(let f=0; f<P.count; f+=3){
    let x=0,y=0,z=0, best='', bw=-1;
    for(let v=f; v<f+3; v++){ x+=P.getX(v); y+=P.getY(v); z+=P.getZ(v); const [n,w]=dom(v); if(w>bw){ bw=w; best=n; } }
    x/=3; y/=3; z/=3;
    c.set(SKINS[i].paint(best,x,y,z));
    const h=Math.sin(x*127.1+y*311.7+z*74.7)*43758.5453, j=0.965+0.06*(h-Math.floor(h));
    for(let v=f; v<f+3; v++){ col[v*3]=c.r*j; col[v*3+1]=c.g*j; col[v*3+2]=c.b*j; }
  }
  g.setAttribute('color', new THREE.BufferAttribute(col,3));
  skinGeoCache.set(key,g); return g;
}
function vcFur(){
  if(!VC_FUR){ VC_FUR=ORIG_FUR.clone(); VC_FUR.map=null; VC_FUR.vertexColors=true; VC_FUR.color.setScalar(1); VC_FUR.roughness=0.8; VC_FUR.flatShading=true; VC_FUR.needsUpdate=true; }
  return VC_FUR;
}
function accFurMat(i){
  if(!accMatCache.has(i)) accMatCache.set(i, new THREE.MeshStandardMaterial({color:SKINS[i].acc, flatShading:true, roughness:0.8}));
  return accMatCache.get(i);
}

}

// ================= online play: host-authoritative P2P rooms (PeerJS) =================
// test transport: with #bc in the URL, two tabs of the same page talk over BroadcastChannel instead of WebRTC
class BCPeer{
  constructor(id){ this.id=typeof id==='string'?id:('p'+Math.random().toString(36).slice(2,8)); this.h={}; this.conns={}; this.ch=new BroadcastChannel('xiaomi-ddz-bc'); this.ch.onmessage=e=>this._msg(e.data); setTimeout(()=>this._emit('open',this.id),60); }
  on(ev,f){ (this.h[ev]=this.h[ev]||[]).push(f); } _emit(ev,...a){ (this.h[ev]||[]).forEach(f=>f(...a)); }
  connect(to){ const c=new BCConn(this,to); this.conns[c.cid]=c; this.ch.postMessage({type:'hello',from:this.id,to,cid:c.cid}); return c; }
  _msg(m){ if(!m||m.to!==this.id) return; const c=this.conns[m.cid];
    if(m.type==='hello'){ const n=new BCConn(this,m.from,m.cid); this.conns[m.cid]=n; this._emit('connection',n); setTimeout(()=>{ n._open(); this.ch.postMessage({type:'ack',from:this.id,to:m.from,cid:m.cid}); },30); }
    else if(m.type==='ack') c&&c._open(); else if(m.type==='data') c&&c._emit('data',m.data); else if(m.type==='close' && c){ c.open=false; c._emit('close'); } }
  destroy(){ try{ this.ch.close(); }catch(e){} }
}
class BCConn{
  constructor(peer,other,cid){ this.peer=peer; this.other=other; this.cid=cid||('c'+Math.random().toString(36).slice(2,8)); this.h={}; this.open=false; }
  on(ev,f){ (this.h[ev]=this.h[ev]||[]).push(f); } _emit(ev,...a){ (this.h[ev]||[]).forEach(f=>f(...a)); }
  _open(){ if(this.open) return; this.open=true; this._emit('open'); }
  send(d){ this.peer.ch.postMessage({type:'data',from:this.peer.id,to:this.other,cid:this.cid,data:JSON.parse(JSON.stringify(d))}); }
  close(){ this.open=false; this.peer.ch.postMessage({type:'close',from:this.peer.id,to:this.other,cid:this.cid}); }
}
const BC_TEST = location.hash==='#bc' && typeof BroadcastChannel==='function';
const PeerImpl = BC_TEST? BCPeer : window.Peer;
const PEER_PREFIX='xiaomi-ddz-room-';
const NET={role:'solo', peer:null, hostConn:null, code:'', askSeq:0, pending:new Map(), lastSent:{}, curAsk:null, syncTimer:0};
const ONLINE_OK = BC_TEST || typeof window.Peer==='function' && typeof RTCPeerConnection!=='undefined' && !/claude\.ai|claudeusercontent|claude\.site/.test(location.host);
function genCode(){ const A='ABCDEFGHJKMNPQRSTUVWXYZ23456789'; let s=''; for(let i=0;i<5;i++) s+=A[Math.floor(Math.random()*A.length)]; return s; }
const cleanName=s=>String(s||'').replace(/[<>&"']/g,'').trim().slice(0,8);

function hostRoom(){
  return new Promise((res,rej)=>{
    const code=genCode(), peer=new PeerImpl(PEER_PREFIX+code,{debug:0});
    let opened=false;
    peer.on('open',()=>{ opened=true; NET.role='host'; NET.peer=peer; NET.code=code; NET.syncTimer=setInterval(()=>syncAll(false),150); res(code); });
    peer.on('error',e=>{ if(!opened) rej(e); else lobbyMsg('联机出错：'+(e.type||e.message)); });
    peer.on('connection',conn=>{
      conn.on('data',msg=>onHostData(conn,msg));
      conn.on('close',()=>dropGuest(conn));
      conn.on('error',()=>dropGuest(conn));
    });
  });
}
function onHostData(conn,msg){
  if(!msg || typeof msg!=='object') return;
  if(msg.t==='hello'){
    if(G.phase!=='idle' && G.phase!=='over'){ conn.send({t:'full', why:'牌局进行中，这局结束后再加入吧'}); setTimeout(()=>conn.close(),400); return; }
    const seat=[1,2].find(s=>PLAYERS[s].kind==='ai');
    if(seat==null){ conn.send({t:'full', why:'房间满了'}); setTimeout(()=>conn.close(),400); return; }
    const name=cleanName(msg.name)||('玩家'+seat);
    PLAYERS[seat]={name, kind:'remote', skin:Math.max(0,Math.min(SKINS.length-1,msg.skin|0)), conn};
    conn.seat=seat; NET.lastSent[seat]='';
    refreshSkins(); renderTags(); renderScores(); renderLobby(); syncAll(true);
    fxAll({k:'toast', text:`${name} 加入了房间`});
  } else if(msg.t==='answer'){
    const p=NET.pending.get(msg.id); if(p && p.seat===conn.seat){ NET.pending.delete(msg.id); p.resolve({value:msg.value}); }
  } else if(msg.t==='throw'){
    if(conn.seat!=null && [0,1,2].includes(msg.to) && msg.to!==conn.seat && ITEMS[msg.item]) fxAll({k:'throw', from:conn.seat, to:msg.to, item:msg.item});
  }
}
function dropGuest(conn){
  const seat=conn.seat; if(seat==null || PLAYERS[seat].conn!==conn) return;
  const name=PLAYERS[seat].name;
  PLAYERS[seat]={name:DEFAULT_NAMES[seat], kind:'ai', skin:DEFAULT_SKINS[seat]};
  for(const [id,p] of NET.pending) if(p.seat===seat){ NET.pending.delete(id); p.resolve({timeout:true}); }
  refreshSkins(); renderTags(); renderScores(); renderLobby(); syncAll(true);
  fxAll({k:'toast', text:`${name} 离开了，小猫接手`});
}
function netBroadcast(msg){ for(const s of [1,2]){ const c=PLAYERS[s].conn; if(PLAYERS[s].kind==='remote' && c && c.open) try{ c.send(msg); }catch(e){} } }
function viewFor(s){
  return {mySeat:s, players:PLAYERS.map(p=>({name:p.name, kind:p.kind==='me'?'host':p.kind, skin:p.skin|0})),
    hand:G.hands[s], counts:G.hands.map(h=>h.length), landlord:G.landlord, base:G.base, mult:G.mult,
    bottom:G.landlord>=0? G.bottom : [], bottomN:G.bottom.length, active:activeSeat, piles:G.piles, scores:roomScores,
    inGame:!(G.phase==='idle'||G.phase==='over'), code:NET.code};
}
function syncAll(force){
  if(NET.role!=='host') return;

    if(PLAYERS[s].kind!=='remote') continue;
    const snap=viewFor(s), str=JSON.stringify(snap);
    if(force || str!==NET.lastSent[s]){ NET.lastSent[s]=str; const c=PLAYERS[s].conn; if(c && c.open) try{ c.send({t:'state', s:snap}); }catch(e){} }
  }
}
function askRemote(g,payload,ms=60000){
  const c=PLAYERS[g].conn; if(!c || !c.open) return Promise.resolve({timeout:true});
  syncAll(true);
  const id=++NET.askSeq; c.send({t:'ask', id, ...payload});
  return new Promise(res=>{
    const timer=setTimeout(()=>{ NET.pending.delete(id); try{ c.send({t:'cancel', id}); }catch(e){} res({timeout:true}); }, ms);
    NET.pending.set(id,{seat:g, resolve:v=>{ clearTimeout(timer); res(v); }});
  });
}

// ---- guest side ----
function joinRoom(code){
  return new Promise((res,rej)=>{
    const peer=new PeerImpl({debug:0}); let done=false;
    const fail=e=>{ if(!done){ done=true; try{ peer.destroy(); }catch(_){} rej(e); } };
    const to=setTimeout(()=>fail(new Error('timeout')),15000);
    peer.on('error',fail);
    peer.on('open',()=>{
      const conn=peer.connect(PEER_PREFIX+code,{reliable:true, serialization:'json'});
      conn.on('open',()=>{ clearTimeout(to); done=true; NET.role='guest'; NET.peer=peer; NET.hostConn=conn; NET.code=code;
        conn.send({t:'hello', name:PLAYERS[0].name, skin:PLAYERS[0].skin}); res(); });
      conn.on('data',onGuestData);
      conn.on('close',()=>{ if(NET.role==='guest') hostGone(); });
      conn.on('error',fail);
    });
  });
}

let lastPiles='[]', lastSkins='';
function onGuestData(msg){

function applySnapshot(s){

  roomScores=s.scores;
  G.hands[0]=s.hand;
  for(const v of [1,2]){ const g=gameOf(v); G.hands[v]=Array.from({length:s.counts[g]},(_,i)=>({id:-1-i,rank:3,suit:'S'})); }
  G.landlord= s.landlord<0? -1 : view(s.landlord); G.base=s.base; G.mult=s.mult;
  G.bottom= s.bottom.length? s.bottom : Array.from({length:s.bottomN},(_,i)=>({id:-100-i,rank:3,suit:'S'}));
  activeSeat= s.active<0? -1 : view(s.active);
  const pj=JSON.stringify(s.piles);
  if(pj!==lastPiles){ lastPiles=pj; for(let g=0;g<3;g++){ const p=s.piles[g]; renderPlayed(view(g), p===null?null:(p==='pass'?'pass':p.cards), p&&p.info); } }
  if(!s.inGame && G.phase!=='over') G.phase='idle';
  renderRound(); renderTags(); renderHand(); renderScores(); renderLobby();
}
async function handleAsk(msg){
  NET.curAsk=msg.id; let v;
  if(msg.k==='bid'){ v=await humanBid(msg.cur); }
  else { G.last=msg.last; const m=await humanPlay(); v= m===undefined? undefined : (m? {ids:m.cards.map(c=>c.id)} : null); }
  if(v===undefined || NET.curAsk!==msg.id) return;
  NET.curAsk=null;
  try{ NET.hostConn.send({t:'answer', id:msg.id, value:v}); }catch(e){}
}

// ================= flow =================
// shared UI for my own turn (used by the host and by online guests)
function humanBid(cur){
  G.phase='bid';
  const p=new Promise(r=>humanResolve=r);
  setControls([{label:'不叫',id:'bid0',onClick:()=>finishHuman(0)},
    ...[1,2,3].map(v=>({label:v+'分',id:'bid'+v,cls:v===3?'gold':'',disabled:v<=cur,onClick:()=>finishHuman(v)}))]);
  return p.then(v=>{ if(G.phase==='bid') G.phase='wait'; return v; });
}
function humanPlay(){
  G.phase='myplay'; hintList=hints(G.hands[0], G.last); hintIdx=0;
  const p=new Promise(r=>humanResolve=r);
  setControls([
    {label:'不要',id:'btnPass',disabled:!G.last,onClick:()=>{ sel.clear(); finishHuman(null); }},
    {label:'提示',id:'btnHint',onClick:()=>{
      if(!hintList.length){ $('myHint').textContent= G.last?'没有能管上的牌':''; return; }
      const m=hintList[hintIdx%hintList.length]; hintIdx++;
      sel.clear(); m.cards.forEach(c=>sel.add(c.id)); renderHand();
    }},
    {label:'出牌',id:'btnPlay',cls:'primary',disabled:true,onClick:()=>{
      const cards=selectedCards(), info=analyze(cards);
      if(info && canBeat(info, G.last&&G.last.info)){ sel.clear(); finishHuman({cards,info}); }
    }},
  ]);
  updateControls();
  if(G.last && !hintList.length) $('myHint').textContent='没有能管上的牌';
  return p.then(m=>{ if(G.phase==='myplay') G.phase='wait'; return m; });
}

// fx: everything transient (toasts, bubbles, reactions, sounds, gifts) goes through here so guests see it too
function applyFx(ev){
  switch(ev.k){
    case 'toast': toast(ev.text, ev.ms); break;
    case 'say': { const v=view(ev.seat); if(v) say(v, ev.text, ev.ms); break; }
    case 'react': { const v=view(ev.seat); if(v) react(v, ev.kind); break; }
    case 'sfx': {
      const a=ev.arg? {...ev.arg} : undefined;
      if(a && a.seat!=null){ if(a.seat===MY && (ev.kind==='play'||ev.kind==='bomb')) pawPop=1; a.seat=view(a.seat); }
      sfx(ev.kind, a); break; }
    case 'bid': {
      const v=view(ev.seat), ai=PLAYERS[ev.seat].kind==='ai';
      if(v===0) toast(ev.bid? `我叫 ${ev.bid} 分` : '我不叫', 900);
      else say(v, ev.bid? (ev.bid===3? (ai?'3分！我来当地主喵':'叫3分！') : `叫${ev.bid}分`) : '不叫');
      break; }
    case 'lord': { const v=view(ev.seat); toast(v===0? '你是地主！' : `${PLAYERS[ev.seat].name} 是地主`); break; }
    case 'start': $('start').hidden=true; $('result').hidden=true; closeGiftMenu(); if(NET.role==='guest'){ G.phase='wait'; lastPiles=''; } break;
    case 'end': showEnd(ev); break;
    case 'throw': startThrow(view(ev.from), view(ev.to), ev.item, ev.from); break;
  }
}
function fxAll(ev){ applyFx(ev); if(NET.role==='host') netBroadcast({t:'fx', ev}); }

// controllers: who decides for each seat
async function getBid(s,cur){
  const k=PLAYERS[s].kind;
  if(k==='me') return humanBid(cur);
  if(k==='remote'){
    const r=await askRemote(s,{k:'bid',cur});
    const v=r.timeout? aiBid(G.hands[s],cur) : r.value;
    return [0,1,2,3].includes(v) && (v===0||v>cur) ? v : 0;
  }
  await sleep(800+Math.random()*500);
  return aiBid(G.hands[s],cur);
}
async function getMove(s){
  const k=PLAYERS[s].kind;
  const ai=()=>aiChoose({hand:G.hands[s], seat:s, landlord:G.landlord, last:G.last, counts:G.hands.map(h=>h.length)});
  if(k==='me') return humanPlay();
  if(k==='remote'){
    const r=await askRemote(s,{k:'play', last:G.last? {seat:G.last.seat, info:G.last.info, cards:G.last.cards} : null});
    if(r.timeout) return G.last? null : ai();
    if(r.value===null) return G.last? null : ai();
    const want=new Set(r.value.ids||[]), cards=G.hands[s].filter(c=>want.has(c.id)), info=analyze(cards);
    if(cards.length && cards.length===want.size && info && canBeat(info, G.last&&G.last.info)) return {cards, info};
    return G.last? null : ai();
  }
  await sleep(750+Math.random()*650);
  return ai();
}
function aiMaybeThrow(from, to, item, p){ if(PLAYERS[from].kind==='ai' && from!==to && Math.random()<p) setTimeout(()=>fxAll({k:'throw', from, to, item}), 500+Math.random()*700); }

async function newGame(){
  if(NET.role==='guest') return;
  fxAll({k:'start'});
  G.landlord=-1; G.base=0; G.mult=1; G.plays=[0,0,0]; G.last=null; G.piles=[null,null,null]; sel.clear(); activeSeat=-1; G.phase='deal';
  clearTable();
  let deck=shuffle(makeDeck());
  G.hands=[deck.slice(0,17),deck.slice(17,34),deck.slice(34,51)].map(sortHand); G.bottom=deck.slice(51);
  renderRound(); renderTags(); renderHand();
  fxAll({k:'toast', text:'发牌'}); fxAll({k:'sfx', kind:'deal'});
  await sleep(700);
  let cur=0, lord=-1, start=Math.floor(Math.random()*3);
  for(let k=0;k<3;k++){
    const s=(start+k)%3; activeSeat=s; renderTags();
    const bid=await getBid(s,cur);
    fxAll({k:'bid', seat:s, bid});
    if(bid===3) fxAll({k:'react', seat:s, kind:'happy'});
    if(PLAYERS[s].kind!=='me') await sleep(450);
    if(bid>cur){ cur=bid; lord=s; }
    if(cur===3) break;
  }
  if(lord<0){ fxAll({k:'toast', text:'都不叫，重新发牌'}); await sleep(1300); return newGame(); }
  G.landlord=lord; G.base=cur; G.phase='play';
  G.hands[lord].push(...G.bottom); sortHand(G.hands[lord]);
  renderRound(); renderTags(); renderHand();
  fxAll({k:'sfx', kind:'landlord'}); fxAll({k:'lord', seat:lord});
  if(PLAYERS[lord].kind==='ai'){ fxAll({k:'react', seat:lord, kind:'happy'}); fxAll({k:'say', seat:lord, text:'底牌是我的了喵~'}); }
  await sleep(1300);
  return playLoop();
}
async function playLoop(){
  let turn=G.landlord, passes=0;
  G.last=null;
  while(true){
    activeSeat=turn; renderTags();
    const move=await getMove(turn);
    if(move){
      const ids=new Set(move.cards.map(c=>c.id));
      G.hands[turn]=G.hands[turn].filter(c=>!ids.has(c.id));
      if(!G.last) clearTable();
      renderPlayed(turn, move.cards, move.info);
      const t=move.info.type, big=(t==='bomb'||t==='rocket');
      fxAll({k:'sfx', kind: big?'bomb':'play', arg:{seat:turn, n:move.cards.length}});
      G.plays[turn]++; G.last={seat:turn, info:move.info, cards:move.cards}; passes=0;
      if(big){
        G.mult*=2; renderRound();
        fxAll({k:'toast', text: t==='rocket'?'王炸！×2':'炸弹！×2'});
        if(PLAYERS[turn].kind==='ai') fxAll({k:'say', seat:turn, text: t==='rocket'?'王炸喵！！':'炸弹！'});
        fxAll({k:'react', seat:turn, kind:'happy'});
        for(const s of [0,1,2]) if(s!==turn && !sameSide(s,turn)){ fxAll({k:'react', seat:s, kind:'sad'}); aiMaybeThrow(s, turn, 'tomato', 0.25); }
      } else if(PLAYERS[turn].kind==='ai' && (move.info.main>=15 || ['plane','plane1','plane2','straight','pairs'].includes(t)) && Math.random()<0.6){
        fxAll({k:'react', seat:turn, kind:'happy'});
      }
      renderHand(); renderTags();
      const left=G.hands[turn].length;
      if(PLAYERS[turn].kind==='ai' && (left===1||left===2)) fxAll({k:'say', seat:turn, text:`我只剩${left}张啦！`, ms:1800});
      if(!left) return endGame(turn);
    } else {
      renderPlayed(turn,'pass'); fxAll({k:'sfx', kind:'pass'});
      if(PLAYERS[turn].kind==='ai'){
        fxAll({k:'say', seat:turn, text:['不要','要不起','过~','喵…不要'][Math.floor(Math.random()*4)], ms:1100});
        if(Math.random()<0.35) fxAll({k:'react', seat:turn, kind:'sad'});
      }
      passes++;
      if(passes===2){
        await sleep(650);
        turn=G.last.seat; G.last=null; passes=0; clearTable();
        continue;
      }
    }
    turn=(turn+1)%3;
  }
}
const sameSide=(a,b)=> a===b || (a!==G.landlord && b!==G.landlord);
async function endGame(winner){
  activeSeat=-1; renderTags(); G.phase='over';
  const lordWin = winner===G.landlord;
  let spring=false;
  if(lordWin && G.plays.every((p,i)=>i===G.landlord||p===0)) spring=true;
  if(!lordWin && G.plays[G.landlord]===1) spring=true;
  if(spring) G.mult*=2;
  const unit=G.base*G.mult, delta=[0,0,0];
  for(let i=0;i<3;i++) delta[i]= i===G.landlord? (lordWin?2:-2)*unit : (lordWin?-1:1)*unit;
  const sc=curScores(); for(let i=0;i<3;i++) sc[i]+=delta[i];
  if(NET.role==='solo') saveScores();
  syncAll(true);
  fxAll({k:'end', winner, landlord:G.landlord, base:G.base, mult:G.mult, spring, lordWin, delta, scores:[...sc], left:G.hands.map(h=>h)});
  // the cats have feelings about it
  const farmers=[0,1,2].filter(s=>s!==G.landlord);
  if(!lordWin) aiMaybeThrow(farmers[0], farmers[1], 'flower', 0.45), aiMaybeThrow(farmers[1], farmers[0], 'heart', 0.3);
  else for(const f of farmers) aiMaybeThrow(f, G.landlord, Math.random()<0.5?'tomato':'fish', 0.3);
}
function showEnd(e){
  activeSeat=-1; G.phase='over';
  if(NET.role==='guest') roomScores=e.scores;
  renderTags(); renderScores(); G.mult=e.mult; renderRound();
  sfx(e.delta[MY]>0?'win':'lose');
  for(const g of [0,1,2]){
    if(g===MY) continue; const v=view(g);
    react(v, e.delta[g]>0?'happy':'sad');
    if(PLAYERS[g].kind==='ai') say(v, e.delta[g]>0? '赢啦喵！':'呜…', 2200);
    if(e.left[g].length) renderPlayed(v, e.left[g], null);
  }
  setTimeout(()=>{
    const iWon=e.delta[MY]>0;
    $('resultSub').textContent = e.lordWin? 'LANDLORD WINS' : 'FARMERS WIN';
    $('resultTitle').textContent = iWon? '你赢了！' : '你输了';
    $('resultDetail').textContent = `地主是${e.landlord===MY?'你':PLAYERS[e.landlord].name}。底分 ${e.base} × 倍数 ${e.mult}${e.spring?'（含春天 ×2）':''}`;
    const rows=$('resultRows'); rows.innerHTML='';
    for(const g of [MY,(MY+1)%3,(MY+2)%3]){
      const name=g===MY?'你':PLAYERS[g].name;
      rows.insertAdjacentHTML('beforeend', `<span>${name}${g===e.landlord?'（地主）':''}</span><span class="d ${e.delta[g]>0?'up':'down'}">${e.delta[g]>0?'+':''}${e.delta[g]}</span><span class="d">${e.scores[g]}</span>`);
    }
    const again=$('againBtn');
    if(NET.role==='guest'){ again.disabled=true; again.textContent='等房主开下一局'; }
    else { again.disabled=false; again.textContent='再来一局'; }
    $('result').hidden=false; if(!again.disabled) again.focus();
  }, 1600);
}

// ================= lobby =================
const myName=()=>{ const v=cleanName($('nameInput').value); return v||'我'; };
let skinPick=0; try{ skinPick=Math.max(0,Math.min(SKINS.length-1, +localStorage.getItem('xiaomi-ddz-skin')||0)); }catch(e){}
const mySkin=()=>skinPick;
function lobbyMsg(t){ const el=$('lobbyMsg'); el.textContent=t||''; el.hidden=!t; }
function showLobbyMode(mode){
  $('lobbyMenu').hidden= mode!=='menu';
  $('roomBox').hidden= mode==='menu';
  $('roomStartBtn').hidden= mode!=='host';
  $('roomWait').hidden= mode!=='guest';
}
function renderSkinPicker(){
  const box=$('skinPicker'); box.innerHTML='';
  SKINS.forEach((sk,i)=>{
    const b=document.createElement('button'); b.type='button'; b.className='skin'+(i===skinPick?' on':''); b.setAttribute('role','radio'); b.setAttribute('aria-checked', String(i===skinPick));
    b.innerHTML=`<span class="chip" style="--a:${sk.chip[0]};--b:${sk.chip[1]}"></span><span>${sk.name}</span><small>${BREEDS[i].breed}</small>`;
    b.onclick=()=>{ if(NET.role==='guest'){ lobbyMsg('已经进房间了，下次加入前再换'); return; } skinPick=i; try{ localStorage.setItem('xiaomi-ddz-skin', i); }catch(e){} PLAYERS[MY].skin=i; refreshSkins(); renderSkinPicker(); syncAll(true); sfx('ui'); };
    box.appendChild(b);
  });
}
function renderLobby(){
  if(!NET.code){ return; }
  $('roomCode').textContent=NET.code;
  const list=$('seatList'); list.innerHTML='';
  for(let g=0;g<3;g++){
    const p=PLAYERS[g], tag= g===0? '房主' : (p.kind==='ai'? '小猫（空位）' : '玩家');
    list.insertAdjacentHTML('beforeend', `<li><span class="chip" style="--a:${SKINS[p.skin|0].chip[0]};--b:${SKINS[p.skin|0].chip[1]}"></span><b>${g===MY?'你':p.name}</b><em>${tag}</em></li>`);
  }
}
function inviteLink(){ return location.origin+location.pathname+'?room='+NET.code; }
function initLobby(){
  try{ $('nameInput').value=localStorage.getItem('xiaomi-ddz-name')||''; }catch(e){}
  $('nameInput').addEventListener('input',()=>{ PLAYERS[MY].name=myName(); try{ localStorage.setItem('xiaomi-ddz-name', $('nameInput').value); }catch(e){} renderLobby(); renderScores(); syncAll(true); });
  PLAYERS[0].name=myName(); PLAYERS[0].skin=skinPick;
  renderSkinPicker(); refreshSkins(); showLobbyMode('menu');
  const q=new URLSearchParams(location.search).get('room');
  if(!ONLINE_OK){
    $('onlineRow').hidden=true;
    lobbyMsg('想和朋友联机？请用网站版打开：zzzzzyzzzzz.github.io/xiaomi-ddz');
  } else if(q){ $('codeInput').value=q.toUpperCase().slice(0,5); lobbyMsg(`朋友邀请你进房间 ${q.toUpperCase()}，填好昵称，点「加入」。`); }
  $('startBtn').onclick=()=>{ PLAYERS[0].name=myName(); newGame(); };
  $('hostBtn').onclick=async()=>{
    PLAYERS[0].name=myName(); lobbyMsg('正在开房间…'); $('hostBtn').disabled=true;
    try{ await hostRoom(); roomScores=[0,0,0]; renderScores(); showLobbyMode('host'); renderLobby(); lobbyMsg('把邀请链接发给朋友。没人坐的位置由小猫代打。'); }
    catch(e){ lobbyMsg('开房间失败，检查一下网络再试。'); }
    $('hostBtn').disabled=false;
  };
  $('joinBtn').onclick=async()=>{
    const code=$('codeInput').value.trim().toUpperCase();
    if(!/^[A-Z0-9]{5}$/.test(code)){ lobbyMsg('房间码是 5 位字母或数字。'); return; }
    PLAYERS[0].name=myName(); PLAYERS[0].skin=skinPick; lobbyMsg('正在加入…'); $('joinBtn').disabled=true;
    try{ await joinRoom(code); showLobbyMode('guest'); lobbyMsg('已加入，等房主开局。'); }
    catch(e){ lobbyMsg('没找到这个房间，确认房间码，或者让房主重新开一个。'); }
    $('joinBtn').disabled=false;
  };
  $('codeInput').addEventListener('keydown', e=>{ if(e.key==='Enter') $('joinBtn').click(); });
  $('copyBtn').onclick=async()=>{
    const link=inviteLink(), out=$('inviteText'); out.value=link; out.hidden=false;
    try{ await navigator.clipboard.writeText(link); $('copyBtn').textContent='已复制'; setTimeout(()=>$('copyBtn').textContent='复制邀请链接',1500); }
    catch(e){ out.select(); lobbyMsg('浏览器不让自动复制，链接已选中，按 Ctrl+C 复制。'); }
  };
  $('roomStartBtn').onclick=()=>newGame();
}
$('sceneBtn').onclick=()=>applyScene(currentScene==='room'?'beach':'room');
$('againBtn').onclick=()=>{ if(NET.role!=='guest') newGame(); };
addEventListener('resize', ()=>{ if(G.hands[0].length) renderHand(); });
$('lobbyBtn').onclick=()=>{ $('result').hidden=true; $('start').hidden=false; showLobbyMode(NET.role==='host'?'host':NET.role==='guest'?'guest':'menu'); renderLobby(); };


async function boot(data){
  if(data && Array.isArray(data.scores)) scores=data.scores;
  renderScores(); resize(); drawSign();
  let savedScene='room'; try{ savedScene=localStorage.getItem('xiaomi-ddz-scene')||'room'; }catch(e){}
  applyScene(savedScene);
  try{ await Promise.all([document.fonts.load('32px "VT323"','0123456789JQKAOER'), document.fonts.load('56px "ZCOOL KuaiLe"','大小')]); }catch(e){}
  try{
    const gltf=await loadGLB();
    cats[1]=makeCat(gltf,1); cats[2]=makeCat(gltf,2);
    cats[1].setCount(17); cats[2].setCount(17);
    initLobby(); renderScores(); renderTags();
  }catch(err){ console.error(err); $('loading').textContent='小猫加载失败，请刷新页面'; return; }
  $('loading').hidden=true; $('start').hidden=false;
  requestAnimationFrame(frame);
  window.__G=G; window.__cats=cats;
}
boot({});
