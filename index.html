<style>
/* Layout: one full-bleed 3D room seen from your chair; HUD floats at the edges, your hand of cards along the bottom. */
:root{
  color-scheme: dark;
  --night:#170f1e;      /* room shadow */
  --plum:#2b1933;       /* panels */
  --plum-hi:#3d2647;
  --paper:#f5ecd8;      /* card stock */
  --ink:#24161f;        /* black suits, text on paper */
  --suit-red:#c9334b;   /* hearts / diamonds */
  --neon:#ff88c9;       /* sign + accent */
  --gold:#f6c453;       /* landlord */
  --text:#f8eff9;
  --muted:#bba9c8;
  --felt:#2e6b59;
  --font-pixel:"Silkscreen", ui-monospace, "Courier New", monospace;
  --font-rank:"Pixelify Sans", ui-monospace, "Courier New", monospace;
  --font-cn:"ZCOOL KuaiLe", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  --cw: clamp(38px, 4.9vw, 64px);
  --ch: calc(var(--cw) * 1.42);
}
html,body{height:100%}
body{background:var(--night);color:var(--text);font-family:var(--font-cn);overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#scene{position:fixed;inset:0;width:100%;height:100%;display:block;image-rendering:pixelated;image-rendering:crisp-edges}
#ui{position:fixed;inset:0;pointer-events:none;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:max(10px, env(safe-area-inset-top, 0px)) max(10px, env(safe-area-inset-bottom, 0px));display:flex;flex-direction:column;justify-content:space-between}
#ui button, #hand, #start, #result{pointer-events:auto}

/* top bar */
#hud{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-start;justify-content:space-between}
.panel{background:color-mix(in srgb, var(--plum) 88%, transparent);border:2px solid var(--plum-hi);box-shadow:0 0 0 2px var(--night), 4px 4px 0 var(--night);padding:6px 10px}
#scores{display:grid;grid-template-columns:auto auto;column-gap:12px;row-gap:2px;font-size:14px}
#scores .v{font-family:var(--font-pixel);text-align:right;font-variant-numeric:tabular-nums}
#round{display:flex;gap:12px;align-items:center;font-size:14px}
#round .num{font-family:var(--font-pixel);color:var(--gold);font-size:16px}
#bottomCards{display:flex;gap:4px;align-items:center}
#bottomCards .lbl{font-size:13px;color:var(--muted);margin-right:4px}

/* cards */
.card{position:relative;width:var(--cw);height:calc(var(--cw) * 1.42);background:var(--paper);color:var(--ink);border:2px solid var(--ink);box-shadow:inset -2px -2px 0 #d8cbb0, 2px 2px 0 rgba(0,0,0,.35);flex:none;font-family:var(--font-pixel);transition:transform .12s steps(3)}
.card.red{color:var(--suit-red)}
.card .r{position:absolute;left:3px;top:2px;font-family:var(--font-rank);font-size:calc(var(--cw)*0.36);line-height:1;font-weight:700;letter-spacing:-1px}
.card .s{position:absolute;left:4px;top:calc(var(--cw)*0.37);font-size:calc(var(--cw)*0.26);line-height:1;font-family:system-ui,sans-serif}
.card .big{position:absolute;right:4px;bottom:2px;font-size:calc(var(--cw)*0.52);line-height:1;font-family:system-ui,sans-serif}
.card.joker .r{writing-mode:vertical-rl;font-family:var(--font-pixel);font-size:calc(var(--cw)*0.2);letter-spacing:0;left:3px;top:3px}
.card.joker .big{font-family:var(--font-cn);font-size:calc(var(--cw)*0.36)}
.card.mini{--cw:30px;margin-left:-14px}
.card.mini:first-child{margin-left:0}
.card.tiny{--cw:24px}

/* table anchors */
.anchor{position:fixed;left:0;top:0;transform:translate(-50%,-50%);pointer-events:none;will-change:transform}
.played{display:flex;align-items:center;justify-content:center}
.played .pass{font-size:18px;color:var(--muted);background:rgba(23,15,30,.7);padding:2px 10px;border:2px solid var(--plum-hi)}
.played .type{position:absolute;top:-20px;left:50%;transform:translateX(-50%);white-space:nowrap;font-size:13px;color:var(--gold);text-shadow:2px 2px 0 var(--night)}
.tag{display:flex;flex-direction:column;align-items:center;gap:2px;text-shadow:2px 2px 0 var(--night)}
.tag .name{font-size:17px}
.tag .meta{display:flex;gap:6px;align-items:center;font-size:13px}
.tag .count{font-family:var(--font-pixel);background:var(--plum);border:2px solid var(--plum-hi);padding:0 6px;font-variant-numeric:tabular-nums}
.tag .count.low{background:var(--suit-red);border-color:#ff9aa9}
.role{font-size:12px;padding:0 5px;border:2px solid currentColor}
.role.lord{color:var(--gold)}
.role.farm{color:#9fe0c3}
.tag.active .name{color:var(--neon)}
.tag.active .name::after{content:" ◀";font-family:var(--font-pixel);font-size:12px}
.bubble{background:var(--paper);color:var(--ink);font-size:16px;padding:4px 10px;border:2px solid var(--ink);box-shadow:3px 3px 0 var(--night);white-space:nowrap;position:relative;transition:opacity .2s}
.bubble::after{content:"";position:absolute;left:50%;bottom:-8px;margin-left:-6px;border:6px solid transparent;border-top-color:var(--ink);border-bottom:0}
.bubble[data-off="1"]{opacity:0}

/* bottom: me */
#me{display:flex;flex-direction:column;align-items:center;gap:8px}
#controls{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;min-height:38px;align-items:center}
#myline{display:flex;gap:8px;align-items:center;font-size:14px;text-shadow:2px 2px 0 var(--night)}
.btn{font-family:var(--font-cn);font-size:16px;color:var(--ink);background:var(--paper);border:2px solid var(--ink);box-shadow:3px 3px 0 var(--night);padding:5px 14px;cursor:pointer}
.btn.primary{background:var(--neon)}
.btn.gold{background:var(--gold)}
.btn:hover:not(:disabled){transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--night)}
.btn:active:not(:disabled){transform:translate(2px,2px);box-shadow:1px 1px 0 var(--night)}
.btn:disabled{opacity:.4;cursor:default}
.btn:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
#hand{display:flex;justify-content:center;width:100%;padding-top:16px;min-height:calc(var(--ch) + 16px);touch-action:none}
#hand .card{cursor:pointer}
#hand .card.sel{transform:translateY(-16px)}
#hand .card.hint{outline:2px dashed var(--neon);outline-offset:-5px}

#toast{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%);font-size:clamp(22px,4vw,34px);color:var(--gold);text-shadow:3px 3px 0 var(--night), -2px -2px 0 var(--night);pointer-events:none;white-space:nowrap;transition:opacity .25s}
#toast[data-off="1"]{opacity:0}

/* overlays */
.overlay{position:fixed;inset:0;display:grid;place-items:center;background:rgba(23,15,30,.45);padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.sheet{background:var(--plum);border:3px solid var(--plum-hi);box-shadow:0 0 0 3px var(--night), 8px 8px 0 var(--night);padding:20px 24px;max-width:420px;width:100%;display:flex;flex-direction:column;gap:12px;align-items:center;text-align:center}
.sheet h1{font-size:clamp(30px,7vw,44px);font-weight:400;margin:0;color:var(--neon);text-shadow:3px 3px 0 var(--night);text-wrap:balance}
.sheet h2{font-size:28px;font-weight:400;margin:0;text-wrap:balance}
.sheet p{margin:0;color:var(--muted);line-height:1.6;font-size:15px}
.sheet .sub{font-family:var(--font-pixel);font-size:12px;letter-spacing:.08em;color:var(--gold)}
#resultRows{display:grid;grid-template-columns:auto auto auto;gap:4px 16px;font-size:16px;width:100%;max-width:280px}
#resultRows .d{font-family:var(--font-pixel);text-align:right;font-variant-numeric:tabular-nums}
#resultRows .up{color:#9fe0c3}
#resultRows .down{color:#ff9aa9}
#loading{position:fixed;inset:0;display:grid;place-items:center;background:var(--night);font-family:var(--font-pixel);color:var(--neon);font-size:14px;letter-spacing:.1em}
@media (max-width:560px){
  #scores{font-size:12px}
  #round{font-size:12px;gap:8px}
  .tag .name{font-size:14px}
  .btn{font-size:15px;padding:5px 10px}
  .card.mini{--cw:24px;margin-left:-11px}
}
@media (prefers-reduced-motion: reduce){ .card,.bubble,#toast{transition:none} }
</style>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import * as SkeletonUtils from 'three/addons/utils/SkeletonUtils.js';

// ===== Dou Dizhu rules + cat AI =====
// rank: 3..14 (A), 15 = 2, 16 = small joker, 17 = big joker
const RANK_LABEL = {11:'J',12:'Q',13:'K',14:'A',15:'2',16:'小王',17:'大王'};
const rankLabel = r => RANK_LABEL[r] || String(r);
const SUITS = ['S','H','C','D'];
const SUIT_CHAR = {S:'♠',H:'♥',C:'♣',D:'♦',J:''};

function makeDeck(){
  const d=[]; let id=0;
  for(let r=3;r<=15;r++) for(const s of SUITS) d.push({id:id++, rank:r, suit:s});
  d.push({id:id++, rank:16, suit:'J'}); d.push({id:id++, rank:17, suit:'J'});
  return d;
}
function shuffle(a, rnd=Math.random){
  for(let i=a.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1)); [a[i],a[j]]=[a[j],a[i]];}
  return a;
}
const sortHand = h => h.sort((a,b)=> b.rank-a.rank || SUITS.indexOf(a.suit)-SUITS.indexOf(b.suit));
function countRanks(cards){ const m=new Map(); for(const c of cards) m.set(c.rank,(m.get(c.rank)||0)+1); return m; }

function isRun(ranks){ // sorted asc distinct, all <=14
  if(ranks[ranks.length-1]>14) return false;
  for(let i=1;i<ranks.length;i++) if(ranks[i]!==ranks[i-1]+1) return false;
  return true;
}
// find highest run of k consecutive ranks (<=14) with count>=3
function tripleRun(cnt, k){
  const tri=[...cnt.keys()].filter(r=>cnt.get(r)>=3 && r<=14).sort((a,b)=>a-b);
  let best=null;
  for(let i=0;i+k<=tri.length;i++){ const run=tri.slice(i,i+k); if(isRun(run)) best=run; }
  return best;
}

// Returns {type, main, n} or null
function analyze(cards){
  const n=cards.length; if(!n) return null;
  const cnt=countRanks(cards);
  const ranks=[...cnt.keys()].sort((a,b)=>a-b);
  const vals=ranks.map(r=>cnt.get(r));
  const only=(c)=>vals.every(v=>v===c);
  if(n===2 && cnt.has(16) && cnt.has(17)) return {type:'rocket',main:17,n};
  if(n===1) return {type:'single',main:ranks[0],n};
  if(ranks.length===1){
    if(n===2) return {type:'pair',main:ranks[0],n};
    if(n===3) return {type:'triple',main:ranks[0],n};
    if(n===4) return {type:'bomb',main:ranks[0],n};
  }
  if(n===4 && ranks.length===2 && vals.includes(3)) return {type:'triple1',main:ranks[vals.indexOf(3)],n};
  if(n===5 && ranks.length===2 && vals.includes(3) && vals.includes(2)) return {type:'triple2',main:ranks[vals.indexOf(3)],n};
  if(n>=5 && only(1) && isRun(ranks)) return {type:'straight',main:ranks[ranks.length-1],n};
  if(n>=6 && n%2===0 && only(2) && ranks.length>=3 && isRun(ranks)) return {type:'pairs',main:ranks[ranks.length-1],n};
  if(n>=6 && n%3===0 && only(3) && ranks.length>=2 && isRun(ranks)) return {type:'plane',main:ranks[ranks.length-1],n};
  const four=ranks.find(r=>cnt.get(r)===4);
  if(four!==undefined && n===6) return {type:'four2',main:four,n};
  if(four!==undefined && n===8){
    const rest=ranks.filter(r=>r!==four);
    if(rest.every(r=>cnt.get(r)===2||cnt.get(r)===4)) return {type:'four22',main:four,n};
  }
  if(n>=8 && n%4===0){ const k=n/4, run=tripleRun(cnt,k); if(run) return {type:'plane1',main:run[run.length-1],n}; }
  if(n>=10 && n%5===0){
    const k=n/5, run=tripleRun(cnt,k);
    if(run){
      const rest=new Map(cnt); for(const r of run) rest.set(r,rest.get(r)-3);
      let pairs=0, ok=true;
      for(const [r,v] of rest){ if(v%2) {ok=false;break;} if(v && r>=16){ok=false;break;} pairs+=v/2; }
      if(ok && pairs===k) return {type:'plane2',main:run[run.length-1],n};
    }
  }
  return null;
}
function canBeat(a, b){
  if(!a) return false;
  if(!b) return true;
  if(a.type==='rocket') return true;
  if(b.type==='rocket') return false;
  if(a.type==='bomb' && b.type!=='bomb') return true;
  if(a.type!==b.type || a.n!==b.n) return false;
  return a.main>b.main;
}
const TYPE_NAME = {single:'单张',pair:'对子',triple:'三张',triple1:'三带一',triple2:'三带二',straight:'顺子',pairs:'连对',
  plane:'飞机',plane1:'飞机带翅膀',plane2:'飞机带翅膀',four2:'四带二',four22:'四带两对',bomb:'炸弹',rocket:'王炸'};

// ---------- move generation for AI / hints ----------
function generateMoves(hand){
  const cnt=countRanks(hand);
  const byRank=new Map(); for(const c of hand){ if(!byRank.has(c.rank)) byRank.set(c.rank,[]); byRank.get(c.rank).push(c); }
  const take=(r,k)=>byRank.get(r).slice(0,k);
  const ranks=[...cnt.keys()].sort((a,b)=>a-b);
  const moves=[];
  const push=(cards)=>{ const info=analyze(cards); if(info) moves.push({cards,info}); };
  // kicker pickers (exclude main ranks), prefer lone cards, low ranks
  const kickers=(exclude, k, size)=>{
    const pool=ranks.filter(r=>!exclude.includes(r) && cnt.get(r)>=size && !(size===2 && r>=16));
    pool.sort((a,b)=>{
      const fa=(cnt.get(a)===size?0:1)+(a>=15?2:0), fb=(cnt.get(b)===size?0:1)+(b>=15?2:0);
      return fa-fb || a-b;
    });
    if(pool.length<k) return null;
    const out=[]; for(const r of pool.slice(0,k)) out.push(...take(r,size));
    return out;
  };
  for(const r of ranks){
    const c=cnt.get(r);
    push(take(r,1));
    if(c>=2) push(take(r,2));
    if(c>=3){
      push(take(r,3));
      const k1=kickers([r],1,1); if(k1) push([...take(r,3),...k1]);
      const k2=kickers([r],1,2); if(k2) push([...take(r,3),...k2]);
    }
    if(c===4) push(take(r,4));
  }
  // straights
  for(let s=3;s<=10;s++) for(let e=s;e<=14;e++){ if(!cnt.get(e)) break; if(e-s+1>=5){ const cs=[]; for(let r=s;r<=e;r++) cs.push(...take(r,1)); push(cs);} }
  // pair runs
  for(let s=3;s<=12;s++) for(let e=s;e<=14;e++){ if((cnt.get(e)||0)<2) break; if(e-s+1>=3){ const cs=[]; for(let r=s;r<=e;r++) cs.push(...take(r,2)); push(cs);} }
  // planes
  for(let s=3;s<=13;s++) for(let e=s+1;e<=14;e++){
    if((cnt.get(s)||0)<3) break;
    if((cnt.get(e)||0)<3) break;
    const main=[]; const used=[]; for(let r=s;r<=e;r++){ main.push(...take(r,3)); used.push(r); }
    const k=used.length;
    push(main);
    const w1=kickers(used,k,1); if(w1) push([...main,...w1]);
    const w2=kickers(used,k,2); if(w2) push([...main,...w2]);
  }
  if(cnt.has(16)&&cnt.has(17)) push([...take(16,1),...take(17,1)]);
  return moves;
}

// cost of a move given hand (lower = better to play)
function moveCost(move, hand){
  const cnt=countRanks(hand), used=countRanks(move.cards);
  let cost=move.info.main - move.cards.length*1.15;
  for(const [r,u] of used){
    const have=cnt.get(r);
    if(u<have) cost += have===4 ? 18 : 4;          // breaking a set
    if(r>=15 && hand.length>6) cost += 5;            // save 2s and jokers
  }
  if(move.info.type==='bomb'||move.info.type==='rocket') cost+=40;
  return cost;
}

// AI decision. ctx: {hand, seat, landlord, last:{seat,info,cards}|null, counts:[n,n,n]}
function aiChoose(ctx){
  const {hand, seat, landlord, last, counts}=ctx;
  const all=generateMoves(hand);
  const finish=all.find(m=>m.cards.length===hand.length && (!last || canBeat(m.info,last.info)));
  if(finish) return finish;
  const isTeam=(a,b)=> a===b || (a!==landlord && b!==landlord);
  const opps=[0,1,2].filter(s=>!isTeam(s,seat));
  const minOpp=Math.min(...opps.map(s=>counts[s]));
  const nextSeat=(seat+1)%3, nextIsOpp=!isTeam(nextSeat,seat);
  const danger=(m)=>{ // stop an opponent who is about to go out
    if(minOpp===1 && m.info.type==='single') return 25 - (m.info.main/2);
    if(minOpp===2 && m.info.type==='pair') return 15;
    return 0;
  };
  if(!last){
    let cands=all.filter(m=>m.info.type!=='bomb'&&m.info.type!=='rocket');
    if(!cands.length) cands=all;
    let best=null, bc=Infinity;
    for(const m of cands){
      let c=moveCost(m,hand)+danger(m);
      if(minOpp===1 && m.info.type==='single'){ // only play your top single then
        const top=Math.max(...hand.map(x=>x.rank));
        c = m.info.main===top ? c-20 : c;
      }
      if(c<bc){bc=c;best=m;}
    }
    return best;
  }
  const beaters=all.filter(m=>canBeat(m.info,last.info));
  if(!beaters.length) return null;
  const teammateLast = isTeam(last.seat,seat);
  if(teammateLast){
    // let teammate's play ride unless it is tiny and we can cover cheaply without breaking anything
    if(!nextIsOpp || counts[last.seat]<=3) return null;
    const cheap=beaters.filter(m=>m.info.type!=='bomb'&&m.info.type!=='rocket' && m.info.main<=11 && moveCost(m,hand)<=m.info.main-m.cards.length*1.15+0.01);
    if(last.info.main<=8 && cheap.length && Math.random()<0.5) return cheap.sort((a,b)=>a.info.main-b.info.main)[0];
    return null;
  }
  const normal=beaters.filter(m=>m.info.type!=='bomb'&&m.info.type!=='rocket');
  if(normal.length){
    let best=null, bc=Infinity;
    for(const m of normal){ const c=moveCost(m,hand); if(c<bc){bc=c;best=m;} }
    // don't burn a 2 / joker on a small single early unless pressured
    const pressured = counts[last.seat]<=5 || hand.length<=5;
    if(!pressured && best.info.main>=15 && last.info.main<=10 && hand.length>8 && Math.random()<0.6) return null;
    return best;
  }
  const big=beaters.sort((a,b)=>a.info.main-b.info.main + (a.info.type==='rocket'?100:0)-(b.info.type==='rocket'?100:0));
  const pressured = counts[last.seat]<=6 || hand.length - big[0].cards.length <= 5;
  return (pressured || Math.random()<0.25) ? big[0] : null;
}

function aiBid(hand, current){
  const cnt=countRanks(hand); let s=0;
  if(cnt.has(17)) s+=4; if(cnt.has(16)) s+=3;
  s+=(cnt.get(15)||0)*2; s+=(cnt.get(14)||0)*1;
  for(const [r,v] of cnt) if(v===4) s+=4;
  const want = s>=10?3 : s>=7?2 : s>=5?1 : 0;
  return want>current ? want : 0;
}

// hint list for the human: all beating moves sorted cheapest first
function hints(hand, last){
  const all=generateMoves(hand).filter(m=>!last||canBeat(m.info,last.info));
  return all.sort((a,b)=>moveCost(a,hand)-moveCost(b,hand));
}

function makeCat(gltf, seat){
  const model=SkeletonUtils.clone(gltf.scene);
  model.scale.setScalar(S);
  model.traverse(o=>{
    if(o.isMesh){
      o.frustumCulled=false;
      const m=o.material;
      if(m && m.name==='Cat_Fur'){ m.color.setScalar(2.6); m.roughness=0.75; }
    }
  });
  const g=new THREE.Group(); g.add(model);
  const p=catPos(seat); g.position.set(p.x,0.62,p.z);
  scene.add(g);
  // fan of card backs held in front of the chest
  const fan=new THREE.Group(); fan.position.set(0,0.31,0.33); fan.rotation.x=-0.35; g.add(fan);
  const backMat=new THREE.MeshStandardMaterial({map:cardBack, roughness:0.8, side:THREE.DoubleSide});
  const geo=new THREE.PlaneGeometry(0.085,0.125);
  const cards=[]; for(let i=0;i<20;i++){ const m=new THREE.Mesh(geo, backMat); fan.add(m); cards.push(m); }
  const mixer=new THREE.AnimationMixer(model);
  const acts={}; for(const clip of gltf.animations){ acts[clip.name]=mixer.clipAction(clip); }
  const idle=acts['Sway']; idle.play(); idle.time=Math.random()*idle.getClip().duration;
  let current=idle;
  mixer.addEventListener('finished', ()=>{ idle.reset().play(); current.crossFadeTo(idle,0.18,false); current=idle; });
  const play=(name)=>{
    const a=acts[name]; if(!a || current===a) return;
    a.reset(); a.setLoop(THREE.LoopOnce,1); a.clampWhenFinished=true; a.play();
    current.crossFadeTo(a,0.15,false); current=a;
  };
  const baseYaw=Math.atan2(CAM_POS.x-p.x, CAM_POS.z-p.z)*0.55 + Math.atan2(TABLE.x-p.x, TABLE.z-p.z)*0.45;
  g.rotation.y=baseYaw;
  return {seat, group:g, model, mixer, play, fan, cards, baseYaw, yaw:baseYaw, setCount(n){
    const k=Math.min(n,20);
    cards.forEach((m,i)=>{ m.visible=i<k; const t=k>1? i/(k-1)-0.5 : 0; m.position.set(t*0.25, -Math.abs(t)*0.04, i*0.002); m.rotation.z=-t*0.9; });
  }};
}

async function newGame(){
  $('result').hidden=true; $('start').hidden=true;
  G.landlord=-1; G.base=0; G.mult=1; G.plays=[0,0,0]; G.last=null; sel.clear(); activeSeat=-1;
  clearTable();
  let deck=shuffle(makeDeck());
  G.hands=[deck.slice(0,17),deck.slice(17,34),deck.slice(34,51)].map(sortHand); G.bottom=deck.slice(51);
  renderRound(); renderTags(); renderHand();
  toast('发牌');
  await sleep(700);
  // bidding
  let cur=0, lord=-1, start=Math.floor(Math.random()*3);
  for(let k=0;k<3;k++){
    const s=(start+k)%3; activeSeat=s; renderTags();
    let bid=0;
    if(s===0){
      G.phase='bid';
      setControls([{label:'不叫',id:'bid0',onClick:()=>finishHuman(0)},
        ...[1,2,3].map(v=>({label:v+'分',id:'bid'+v,cls:v===3?'gold':'',disabled:v<=cur,onClick:()=>finishHuman(v)}))]);
      bid=await waitHuman();
      toast(bid? `我叫 ${bid} 分`:'我不叫', 900);
    } else {
      await sleep(800+Math.random()*500);
      bid=aiBid(G.hands[s],cur);
      say(s, bid? (bid===3?'3分！我来当地主喵':`叫${bid}分`) : '不叫');
      if(bid===3) react(s,'happy');
      await sleep(500);
    }
    if(bid>cur){ cur=bid; lord=s; }
    if(cur===3) break;
  }
  if(lord<0){ toast('都不叫，重新发牌'); await sleep(1300); return newGame(); }
  G.landlord=lord; G.base=cur;
  G.hands[lord].push(...G.bottom); sortHand(G.hands[lord]);
  renderRound(); renderTags(); renderHand();
  if(lord===0) toast('你是地主！'); else { toast(`${NAMES[lord]} 是地主`); react(lord,'happy'); say(lord,'底牌是我的了喵~'); }
  await sleep(1300);
  return playLoop();
}

async function playLoop(){
  let turn=G.landlord, passes=0;
  G.last=null;
  while(true){
    activeSeat=turn; renderTags();
    let move;
    if(turn===0){
      G.phase='myplay'; hintList=hints(G.hands[0], G.last); hintIdx=0;
      if(G.last && !hintList.length){ $('myHint').textContent='没有能管上的牌'; }
      setControls([
        {label:'不要',id:'btnPass',disabled:!G.last,onClick:()=>{ sel.clear(); finishHuman(null); }},
        {label:'提示',id:'btnHint',onClick:()=>{
          if(!hintList.length){ $('myHint').textContent= G.last?'没有能管上的牌':''; return; }
          const m=hintList[hintIdx%hintList.length]; hintIdx++;
          sel.clear(); m.cards.forEach(c=>sel.add(c.id)); renderHand();
        }},
        {label:'出牌',id:'btnPlay',cls:'primary',disabled:true,onClick:()=>{
          const cards=selectedCards(), info=analyze(cards);
          if(info && canBeat(info, G.last&&G.last.info)){ sel.clear(); finishHuman({cards,info}); }
        }},
      ]);
      updateControls();
      move=await waitHuman();
      G.phase='wait';
    } else {
      await sleep(750+Math.random()*650);
      move=aiChoose({hand:G.hands[turn], seat:turn, landlord:G.landlord, last:G.last, counts:G.hands.map(h=>h.length)});
    }
    if(move){
      const ids=new Set(move.cards.map(c=>c.id));
      G.hands[turn]=G.hands[turn].filter(c=>!ids.has(c.id));
      if(!G.last) clearTable();
      renderPlayed(turn, move.cards, move.info);
      G.plays[turn]++; G.last={seat:turn, info:move.info, cards:move.cards}; passes=0;
      const t=move.info.type;
      if(t==='bomb'||t==='rocket'){
        G.mult*=2; renderRound();
        toast(t==='rocket'?'王炸！×2':'炸弹！×2');
        if(turn>0){ say(turn, t==='rocket'?'王炸喵！！':'炸弹！'); react(turn,'happy'); }
        for(const s of [1,2]) if(s!==turn && !sameSide(s,turn)) react(s,'sad');
      } else if(turn>0 && (move.info.main>=15 || ['plane','plane1','plane2','straight','pairs'].includes(t)) && Math.random()<0.6){
        react(turn,'happy');
      }
      if(turn===0) renderHand();
      renderTags();
      const left=G.hands[turn].length;
      if(turn>0 && (left===1||left===2)) say(turn, `我只剩${left}张啦！`, 1800);
      if(!left) return endGame(turn);
    } else {
      renderPlayed(turn,'pass');
      if(turn>0){ say(turn,['不要','要不起','过~','喵…不要'][Math.floor(Math.random()*4)], 1100); if(Math.random()<0.35) react(turn,'sad'); }
      passes++;
      if(passes===2){
        await sleep(650);
        turn=G.last.seat; G.last=null; passes=0; clearTable();
        continue;
      }
    }
    turn=(turn+1)%3;
  }
}
const sameSide=(a,b)=> a===b || (a!==G.landlord && b!==G.landlord);

async function endGame(winner){
  activeSeat=-1; renderTags(); G.phase='over';
  const lordWin = winner===G.landlord;
  let spring=false;
  if(lordWin && G.plays.every((p,i)=>i===G.landlord||p===0)) spring=true;
  if(!lordWin && G.plays[G.landlord]===1) spring=true;
  if(spring) G.mult*=2;
  const unit=G.base*G.mult;
  const delta=[0,0,0];
  for(let i=0;i<3;i++){
    if(i===G.landlord) delta[i]= lordWin? 2*unit : -2*unit;
    else delta[i]= lordWin? -unit : unit;
  }
  for(let i=0;i<3;i++) scores[i]+=delta[i];
  saveScores(); renderScores(); renderRound();
  for(const s of [1,2]){ react(s, delta[s]>0?'happy':'sad'); say(s, delta[s]>0? '赢啦喵！':'呜…', 2200); }
  // reveal cats' leftover cards
  for(const s of [1,2]) if(G.hands[s].length) renderPlayed(s, G.hands[s], null);
  await sleep(1600);
  const iWon=delta[0]>0;
  $('resultSub').textContent = lordWin? 'LANDLORD WINS' : 'FARMERS WIN';
  $('resultTitle').textContent = iWon? '你赢了！' : '你输了';
  $('resultDetail').textContent = `地主是${G.landlord===0?'你':NAMES[G.landlord]}。底分 ${G.base} × 倍数 ${G.mult}${spring?'（含春天 ×2）':''}`;
  const rows=$('resultRows'); rows.innerHTML='';
  for(let i=0;i<3;i++){
    rows.insertAdjacentHTML('beforeend', `<span>${NAMES[i]}${i===G.landlord?'（地主）':''}</span><span class="d ${delta[i]>0?'up':'down'}">${delta[i]>0?'+':''}${delta[i]}</span><span class="d">${scores[i]}</span>`);
  }
  $('result').hidden=false; $('againBtn').focus();
}

$('startBtn').onclick=()=>newGame();
$('againBtn').onclick=()=>newGame();
addEventListener('resize', ()=>{ if(G.hands[0].length) renderHand(); });


async function boot(data){
  if(data && Array.isArray(data.scores)) scores=data.scores;
  renderScores(); resize(); drawSign();
  try{
    const gltf=await loadGLB();
    cats[1]=makeCat(gltf,1); cats[2]=makeCat(gltf,2);
    cats[1].setCount(17); cats[2].setCount(17);
  }catch(err){ console.error(err); $('loading').textContent='小猫加载失败，请刷新页面'; return; }
  $('loading').hidden=true; $('start').hidden=false;
  requestAnimationFrame(frame);
  window.__G=G; window.__cats=cats;
}
boot({});
</script>
